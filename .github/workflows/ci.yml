name: CI

# main auto-deploys to production, so gate every PR (and direct push) with typecheck,
# unit tests, and a production build. Make this a REQUIRED check + protect `main`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  attestations: read
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run plan:check
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_BRANCH_TIP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # build must not require runtime secrets; these are placeholders so any
          # accidental build-time env read fails loudly rather than using a real value.
          GOOGLE_SHEET_ID: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
      - run: node --import tsx scripts/p9-production-runtime.ts --require-build-trace
